<div class="mx-auto max-w-7xl p-6">
  <h1 class="mb-4 text-3xl font-bold text-white">Search Movies</h1>

  <div class="mb-8 max-w-2xl">
    <app-search-box [value]="query()" [focusOnLoad]="true" [clearNavigates]="true" />
  </div>

  <!-- Show exactly one of: prompt, loading, error, results, or nothing found -->
  @if (!query()) {
    <app-empty-state
      icon="🔍"
      title="Search for a movie"
      message="Type a title above and press Enter. Suggestions appear as you type."
    />
  } @else if (isLoading()) {
    <app-loading-skeleton [count]="10" />
  } @else if (errorMessage(); as message) {
    <app-error-state [message]="message" (retry)="retry()" />
  } @else if (movies().length > 0) {
    <p class="mb-4 text-muted">
      {{ totalResults() | number }} results for
      <span class="font-semibold text-white">"{{ query() }}"</span>
    </p>

    <section class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (movie of movies(); track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </section>

    <nav class="mt-8 flex items-center justify-center gap-4" aria-label="Pagination">
      <button
        (click)="goToPage(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="rounded-lg bg-accent px-4 py-2 text-white transition hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-40"
      >
        Previous
      </button>

      <span class="text-muted">Page {{ currentPage() }} of {{ totalPages() }}</span>

      <button
        (click)="goToPage(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="rounded-lg bg-accent px-4 py-2 text-white transition hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-40"
      >
        Next
      </button>
    </nav>
  } @else {
    <app-empty-state
      icon="🎞️"
      title="No movies found"
      [message]="'We found nothing for “' + query() + '”. Check the spelling or try a different title.'"
    />
  }
</div>
