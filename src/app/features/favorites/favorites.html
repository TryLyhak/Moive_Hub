<div class="mx-auto max-w-7xl p-6">
  <h1 class="mb-6 text-3xl font-bold text-white">My Favorites ❤️</h1>

  @if (favoritesService.favorites().length > 0) {
    <section class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (movie of favoritesService.favorites(); track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </section>
  } @else {
    <app-empty-state icon="🤍" title="No favorites yet" message="Tap the heart on any movie to save it here.">
      <!-- This button is passed into the empty state through <ng-content /> -->
      <a
        routerLink="/movies"
        class="rounded-lg bg-accent px-5 py-2 font-semibold text-white transition hover:bg-accent-hover"
      >
        Browse movies
      </a>
    </app-empty-state>
  }
</div>
