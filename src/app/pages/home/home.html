<!-- Page container: centered, with a maximum width -->
<div class="mx-auto max-w-7xl p-6">
  <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-3xl font-bold text-white">
      @if (searchText()) {
        Results for "{{ searchText() }}"
      } @else {
        Popular Movies 🎬
      }
    </h1>

    <input
      type="search"
      placeholder="Search movies..."
      (input)="onSearchInput($event)"
      class="w-full rounded-lg bg-card px-4 py-2 text-white outline-none placeholder:text-muted focus:ring-2 focus:ring-accent sm:w-80"
    />
  </header>

  <!-- Show exactly one of: loading, error, movies, or nothing found -->
  @if (isLoading()) {
    <app-loading-skeleton [count]="10" />
  } @else if (errorMessage(); as message) {
    <app-error-state [message]="message" (retry)="loadMovies()" />
  } @else if (movies().length > 0) {
    <section class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (movie of movies(); track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </section>

    <nav class="mt-8 flex items-center justify-center gap-4">
      <button
        (click)="goToPage(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="rounded-lg bg-accent px-4 py-2 text-white transition hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-40"
      >
        Previous
      </button>

      <span class="text-muted">Page {{ currentPage() }} of {{ totalPages() }}</span>

      <button
        (click)="goToPage(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="rounded-lg bg-accent px-4 py-2 text-white transition hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-40"
      >
        Next
      </button>
    </nav>
  } @else {
    <app-empty-state
      icon="🔍"
      title="No movies found"
      message="Try a different title or check your spelling."
    />
  }
</div>
