<section class="mb-10">
  <div class="mb-3 flex items-end justify-between px-6">
    <h2 class="text-2xl font-bold text-white">{{ title() }}</h2>

    @if (category()) {
      <!-- Opens /movies?category=... -->
      <a
        routerLink="/movies"
        [queryParams]="{ category: category() }"
        class="text-sm text-muted transition hover:text-white"
      >
        See all →
      </a>
    }
  </div>

  <div class="flex gap-4 overflow-x-auto px-6 pb-4">
    @for (movie of movies(); track movie.id) {
      <div class="w-40 shrink-0 sm:w-44">
        <app-movie-card [movie]="movie" />
      </div>
    }
  </div>
</section>
