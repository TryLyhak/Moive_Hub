<div class="relative w-full">
  <form (submit)="onSubmit($event)" role="search" class="relative">
    <input
      #searchInput
      type="text"
      [value]="text()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      placeholder="Search movies by title..."
      autocomplete="off"
      aria-label="Search movies"
      role="combobox"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="listId"
      [attr.aria-activedescendant]="activeIndex() >= 0 ? listId + '-' + activeIndex() : null"
      class="w-full rounded-full bg-card py-3 pl-12 pr-12 text-white outline-none placeholder:text-muted focus:ring-2 focus:ring-accent"
    />

    <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2" aria-hidden="true">🔍</span>

    <!-- Clear button (only when there is text) -->
    @if (text()) {
      <button
        type="button"
        (click)="clear()"
        aria-label="Clear search"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-muted transition hover:text-white"
      >
        ✕
      </button>
    }
  </form>

  <!-- Validation message for an empty search -->
  @if (showEmptyError()) {
    <p class="mt-2 px-4 text-sm text-red-400" role="alert">Please type a movie title to search.</p>
  }

  <!-- Suggestions dropdown -->
  @if (isOpen() && suggestions().length > 0) {
    <ul
      [id]="listId"
      role="listbox"
      class="absolute z-40 mt-2 w-full overflow-hidden rounded-xl border border-white/10 bg-surface shadow-2xl"
    >
      @for (movie of suggestions(); track movie.id; let i = $index) {
        <li role="option" [id]="listId + '-' + i" [attr.aria-selected]="i === activeIndex()">
          <a
            [routerLink]="['/movies', movie.id]"
            (click)="onSuggestionClick()"
            [class.bg-card]="i === activeIndex()"
            class="flex items-center gap-3 px-3 py-2 transition hover:bg-card"
          >
            <img
              [src]="thumbUrl(movie.poster_path)"
              alt=""
              class="h-14 w-10 shrink-0 rounded object-cover"
            />
            <span class="min-w-0">
              <span class="block truncate font-semibold text-white">{{ movie.title }}</span>
              <span class="block text-xs text-muted">{{ year(movie.release_date) }}</span>
            </span>
          </a>
        </li>
      }

      <li role="presentation" class="border-t border-white/10">
        <button
          type="button"
          (click)="runSearch()"
          class="w-full px-3 py-3 text-left text-sm font-semibold text-accent transition hover:bg-card"
        >
          See all results for "{{ text().trim() }}"
        </button>
      </li>
    </ul>
  }
</div>
